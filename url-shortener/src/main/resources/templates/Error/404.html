<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 — Short URL Not Found</title>
    <style>
        /* Basic reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
          height: 100%;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background: #f4f4f4;
          color: #333;
        }

        .container {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          height: 100%;
          text-align: center;
          padding: 20px;
        }

        .error-code {
          font-size: 8rem;
          font-weight: bold;
          color: #e74c3c;
        }

        .message {
          font-size: 1.25rem;
          margin: 20px 0;
        }

        .details {
          color: #666;
          margin-bottom: 30px;
        }

        .btn-home {
          display: inline-block;
          padding: 12px 24px;
          font-size: 1rem;
          color: #fff;
          background-color: #3498db;
          text-decoration: none;
          border-radius: 4px;
          transition: background-color 0.2s ease;
        }
        .btn-home:hover {
          background-color: #2980b9;
        }

        /* Optional icon */
        .icon {
          font-size: 4rem;
          margin-bottom: 20px;
          color: #e74c3c;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- You can replace this with an <img> or SVG if you prefer -->
    <div class="icon">⚠️</div>
    <div class="error-code">404</div>
    <div class="message">Oops! We can’t find that short link.</div>
    <div class="details">
        The short URL you’re looking for doesn’t exist or has been removed.<br>
        Check the link and try again, or go back home.
    </div>
    <a href="/home" class="btn-home">Return to Home</a>
</div>
</body>
</html>
